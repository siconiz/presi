<title>대통령 5년</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: 집무실 책상 — 왼쪽은 국정 지표판, 가운데는 결재 대기 보고서 한 장, 아래는 국정 일지. 좁은 화면에선 한 줄로 쌓임. */
:root {
  --bg: #eef1f2;
  --sheet: #ffffff;
  --ink: #18222c;
  --muted: #5a6874;
  --line: #d3dade;
  --jade: #1d6a5b;
  --jade-soft: #dcebe6;
  --seal: #b3261e;
  --good: #23784a;
  --bad: #b3261e;
  --warn: #9a6300;
  --track: #e2e7ea;
  --f-display: "Gowun Batang", "Nanum Myeongjo", "Batang", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1418; --sheet: #182027; --ink: #e5eaee; --muted: #93a1ac; --line: #2a353e;
    --jade: #63b9a5; --jade-soft: #1d3530; --seal: #e3685e; --good: #5cc28a; --bad: #ec7a70;
    --warn: #e0a84a; --track: #24303a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1418; --sheet: #182027; --ink: #e5eaee; --muted: #93a1ac; --line: #2a353e;
  --jade: #63b9a5; --jade-soft: #1d3530; --seal: #e3685e; --good: #5cc28a; --bad: #ec7a70;
  --warn: #e0a84a; --track: #24303a; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; font-weight: 700; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 11.5px; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, label:focus-within { outline: 2px solid var(--jade); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* 머리말 */
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 24px; padding-bottom: 14px; border-bottom: 2px solid var(--ink); }
.top h1 { font-size: clamp(24px, 4vw, 34px); line-height: 1.15; }
.top h1 small { display: block; font-family: var(--f-body); font-size: 12.5px; font-weight: 500; color: var(--muted); letter-spacing: .04em; margin-bottom: 4px; }
.term { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 0 1 360px; }
.term-head { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.term-head b { font-family: var(--f-display); font-size: 18px; }
.segs { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; }
.segs i { height: 8px; background: var(--track); border-radius: 1px; }
.segs i.done { background: var(--jade); }
.segs i.now { background: var(--seal); }
.segs i.elect { box-shadow: inset 0 -3px 0 var(--warn); }

/* 본문 그리드 */
.grid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }

/* 지표판 */
.board { display: flex; flex-direction: column; gap: 14px; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.poll { display: flex; flex-direction: column; gap: 4px; padding-bottom: 14px; border-bottom: 1px dashed var(--line); }
.poll-num { display: flex; align-items: baseline; gap: 8px; }
.poll-num strong { font-family: var(--f-display); font-size: 52px; line-height: 1; }
.poll-num span { font-size: 18px; color: var(--muted); }
.poll .src { font-size: 11px; color: var(--muted); line-height: 1.4; }
.spark { width: 100%; height: 54px; display: block; }
.stat { display: grid; grid-template-columns: 48px 1fr 44px; align-items: center; gap: 10px; font-size: 13.5px; }
.stat .nm { font-weight: 600; }
.bar { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--jade); border-radius: 4px; transition: width .5s ease; }
.bar.low > span { background: var(--bad); }
.bar.mid > span { background: var(--warn); }
.bar.fat > span { background: var(--muted); }
.stat .v { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 13px; }
.treasury { display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; border-top: 1px dashed var(--line); }
.treasury b { font-family: var(--f-mono); font-size: 20px; font-variant-numeric: tabular-nums; }
.treasury b.neg { color: var(--bad); }
.warns { display: flex; flex-direction: column; gap: 6px; }
.warn { font-size: 12.5px; padding: 6px 10px; border-radius: 4px; background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); font-weight: 600; }

/* 보고서 */
.desk { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.doc { position: relative; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 26px clamp(18px, 4vw, 36px) 28px; overflow: hidden; }
.doc-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; font-size: 12px; color: var(--muted); padding-bottom: 12px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
.doc-meta .cls { color: var(--seal); font-weight: 700; letter-spacing: .1em; }
.doc h2 { font-size: clamp(22px, 3.2vw, 28px); line-height: 1.3; margin-bottom: 12px; }
.doc p { margin: 0 0 18px; max-width: 62ch; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice { text-align: left; display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; padding: 14px 16px; background: transparent; border: 1px solid var(--line); border-radius: var(--r); transition: border-color .15s, background .15s; }
.choice:hover { border-color: var(--jade); background: var(--jade-soft); }
.choice .k { font-family: var(--f-display); font-weight: 700; font-size: 17px; color: var(--jade); line-height: 1.4; }
.choice .t { font-weight: 600; }
.choice .s { display: block; font-size: 13px; color: var(--muted); font-weight: 400; margin-top: 2px; }
.result { display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; background: var(--bg); border-radius: var(--r); }
.result p { margin: 0; }
.result.bad { box-shadow: inset 3px 0 0 var(--bad); }
.deltas { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--f-mono); font-size: 12px; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; font-variant-numeric: tabular-nums; }
.chip.up { color: var(--good); }
.chip.down { color: var(--bad); }
.stamp { position: absolute; right: clamp(14px, 4vw, 34px); top: 64px; width: 84px; height: 84px; border: 3px solid var(--seal); border-radius: 50%; color: var(--seal); font-family: var(--f-display); font-weight: 700; display: grid; place-items: center; text-align: center; font-size: 15px; line-height: 1.15; transform: rotate(-14deg); opacity: .85; animation: stamp .35s cubic-bezier(.2,1.6,.4,1) both; pointer-events: none; }
.stamp::before { content: ""; position: absolute; inset: 5px; border: 1px solid var(--seal); border-radius: 50%; }
@keyframes stamp { from { transform: rotate(-14deg) scale(1.8); opacity: 0; } to { transform: rotate(-14deg) scale(1); opacity: .85; } }

/* 일정(행동) */
.agenda { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 18px clamp(18px, 4vw, 24px); display: flex; flex-direction: column; gap: 14px; }
.agenda-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.agenda-head h3 { font-size: 19px; }
.pc { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.pc i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--jade); }
.pc i.on { background: var(--jade); }
.acts { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.act { text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: transparent; display: flex; flex-direction: column; gap: 2px; transition: border-color .15s, background .15s; }
.act:hover:not(:disabled) { border-color: var(--jade); background: var(--jade-soft); }
.act:disabled { opacity: .42; cursor: not-allowed; }
.act b { font-size: 14px; }
.act span { font-size: 12px; color: var(--muted); line-height: 1.4; }
.next { align-self: flex-end; padding: 12px 22px; border: 0; border-radius: var(--r); background: var(--ink); color: var(--sheet); font-weight: 700; font-size: 15px; }
.next:hover { background: var(--jade); }
.hint { font-size: 13px; color: var(--muted); margin: 0; }

/* 일지 */
.log { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 18px clamp(18px, 4vw, 24px); }
.log h3 { font-size: 19px; margin-bottom: 10px; }
.log ol { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow-y: auto; }
.log li { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.log li:first-child { border-top: 0; }
.log li .when { font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding-top: 1px; }
.log li.news .what { color: var(--muted); }
.log li.news .what::before { content: "언론 · "; font-weight: 600; }
.log li.big .what { font-weight: 700; }
@media (max-width: 480px) { .log li { grid-template-columns: 1fr; gap: 0; } }

/* 취임 준비 */
.setup { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(22px, 5vw, 44px); display: flex; flex-direction: column; gap: 26px; }
.setup-intro { max-width: 62ch; }
.setup-intro h2 { font-size: clamp(26px, 4vw, 36px); line-height: 1.25; margin-bottom: 10px; }
.setup-intro p { margin: 0; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 10px; }
.namerow { display: flex; gap: 8px; flex-wrap: wrap; }
.namerow input { flex: 1 1 200px; min-width: 0; font: inherit; font-family: var(--f-display); font-size: 22px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); color: var(--ink); }
.ghost { padding: 8px 14px; border: 1px solid var(--line); border-radius: var(--r); background: transparent; font-size: 13.5px; }
.ghost:hover { border-color: var(--jade); }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.opt { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; transition: border-color .15s, background .15s; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt:has(input:checked) { border-color: var(--jade); background: var(--jade-soft); box-shadow: inset 0 0 0 1px var(--jade); }
.opt b { font-size: 15px; }
.opt span { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.opt em { font-style: normal; font-family: var(--f-mono); font-size: 11.5px; color: var(--jade); }
.oath { align-self: flex-start; padding: 14px 28px; border: 0; border-radius: var(--r); background: var(--seal); color: #fff; font-family: var(--f-display); font-weight: 700; font-size: 18px; }

/* 퇴임 / 종료 */
.ending { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(22px, 5vw, 44px); display: flex; flex-direction: column; gap: 20px; }
.ending .kind { color: var(--seal); font-weight: 700; letter-spacing: .1em; font-size: 12.5px; }
.ending h2 { font-size: clamp(28px, 5vw, 44px); line-height: 1.2; }
.ending p { margin: 0; max-width: 62ch; }
.verdict { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; }
.grade { width: 108px; height: 108px; border: 4px double var(--seal); border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-size: 52px; font-weight: 700; color: var(--seal); transform: rotate(-8deg); flex: none; }

.finals { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.finals div { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; }
.finals b { font-family: var(--f-mono); font-size: 20px; font-variant-numeric: tabular-nums; }
.bigspark { width: 100%; height: 120px; display: block; }
</style>

    [(s) => s.se > 70, "방산 수출 세계 5위 진입"],
    [(s) => s.as < 30, "여야 극한 대치… 법안 처리율 역대 최저"],
    [(s) => s.as > 70, "\"이런 국회 처음\"… 여야 민생법안 무더기 합의"],
    [(s) => s.tr < 0, "국가채무 비율 경고등… 신용평가사 \"예의주시\""],
    [(s) => s.fat > 75, "\"대통령 얼굴이 안 좋다\"… 참모들 일정 축소 건의"],
  ];

  function nextQuarter() {
    if (G.phase !== "action") return;
    const s = G.s;
    // 국고: 경제가 좋으면 세수 증가, 나쁘면 적자
    s.tr += Math.round((s.ec - 46) * 0.5);
    // 지표 자연 변동
    s.ec = clamp(s.ec + ri(-3, 2) + (s.we < 30 ? -2 : 0));
    s.we = clamp(s.we + ri(-2, 1) + (s.ec < 35 ? -2 : 0));
    s.se = clamp(s.se + ri(-2, 1));
    s.fat = clamp(s.fat - 18);
    // 지지율은 국정 지표를 따라가고, 임기가 갈수록 조금씩 깎인다
    const target = s.ec * 0.32 + s.we * 0.32 + s.se * 0.2 + s.as * 0.16;
    const honey = G.q < 2 ? 2 : 0;
    s.ap = clamp(Math.round(s.ap + (target - s.ap) * 0.3 - 1 + honey + rand(-2, 2)));
    G.hist.push(s.ap);
    const hl = HEADLINES.filter(([c]) => c(s));
    if (hl.length) addLog(pick(hl)[1], "news");
    if (G.q === TERM - 1) { G.q += 1; finish("retire"); return; }
    G.q += 1;
    if (G.q === ELECTION_Q) election();
    if (checkEnd()) return;
    startQuarter();
  }

  function election() {
    const seats = clamp(Math.round(G.s.ap * 0.85 + 12 + rand(-6, 6)), 5, 95);
    const before = G.s.as;
    G.s.as = seats;
    const party = PARTIES.find((p) => p.id === G.party).name;
    const verdict = seats >= 55 ? "압승" : seats >= 45 ? "선전" : seats >= 35 ? "패배" : "참패";
    addLog(`제23대 총선 실시. ${party} ${verdict}. 국회 협조 ${before} → ${seats}.`, "big");
    G.electionNote = { verdict, before, seats };
  }

  function checkEnd() {
    const s = G.s;
    if (s.tr <= -60) { finish("default"); return true; }
    if (s.se <= 4) { finish("war"); return true; }
    if (s.ap <= 15 && s.as <= 35) { finish("impeach"); return true; }
    return false;
  }

  function finish(kind) {
    G.phase = "over"; G.end = kind;
    const map = { retire: "임기를 마치고 퇴임했다.", default: "국가부도 사태로 IMF 구제금융을 신청했다.", war: "안보 붕괴로 국가비상사태가 선포됐다.", impeach: "국회가 탄핵소추안을 가결했다. 직무가 정지됐다." };
    addLog(map[kind], "big");
    render();
  }

  function score() {
    const s = G.s;
    const avgAp = G.hist.reduce((a, b) => a + b, 0) / G.hist.length;
    let v = s.ap * 0.3 + avgAp * 0.2 + (s.ec + s.we + s.se) / 3 * 0.4 + s.as * 0.05 + clamp(s.tr / 2, -20, 20) * 0.25;
    if (G.end !== "retire") v = Math.min(v, 25);
    const grade = v >= 66 ? "S" : v >= 58 ? "A" : v >= 50 ? "B" : v >= 42 ? "C" : v >= 30 ? "D" : "F";
    const top = [["ec", "경제 대통령"], ["we", "서민의 대통령"], ["se", "안보 대통령"], ["as", "협치의 대통령"]].sort((a, b) => s[b[0]] - s[a[0]])[0];
    const titles = { S: "교과서에 실릴 대통령", A: "다시 보고 싶은 대통령", B: "무난했던 5년", C: "아쉬움이 남는 대통령", D: "잊고 싶은 5년", F: "실패한 정부" };
    return { v: Math.round(v), grade, nick: G.end === "retire" ? top[1] : "중도 하차", title: titles[grade], avgAp: Math.round(avgAp) };
  }

  // ───────── 그리기 ─────────
  function spark(vals, h, cls, showAxis) {
    const w = 300, pad = 4;
    const n = Math.max(vals.length, 2);
    const x = (i) => pad + (i / (Math.max(TERM, n - 1))) * (w - pad * 2);
    const y = (v) => h - pad - (v / 100) * (h - pad * 2);
    const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    const last = vals[vals.length - 1];
    const area = vals.length > 1 ? `<polygon points="${x(0)},${h - pad} ${pts} ${x(vals.length - 1)},${h - pad}" fill="var(--jade)" opacity=".12"/>` : "";
    const grid = [25, 50, 75].map((g) => `<line x1="${pad}" x2="${w - pad}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-width="1" ${g === 50 ? "" : 'stroke-dasharray="2 3"'}/>`).join("");
    const axis = showAxis ? [25, 50, 75].map((g) => `<text x="${w - pad}" y="${y(g) - 3}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${g}%</text>`).join("") : "";
    return `<svg class="${cls}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="지지율 추이">${grid}${area}<polyline points="${pts}" fill="none" stroke="var(--jade)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>${axis}<circle cx="${x(vals.length - 1)}" cy="${y(last)}" r="3.5" fill="var(--seal)"/></svg>`;
  }

  const chips = (d) => Object.entries(d).filter(([, v]) => v).map(([k, v]) => {
    const good = k === "fat" ? v < 0 : v > 0;
    const unit = k === "tr" ? "조" : "";
    return `<span class="chip ${good ? "up" : "down"}">${NAMES[k]} ${v > 0 ? "+" : "−"}${Math.abs(v)}${unit}</span>`;
  }).join("");

  function header() {
    const segs = Array.from({ length: TERM }, (_, i) => `<i class="${i < G.q ? "done" : i === G.q && G.phase !== "over" ? "now" : ""} ${i === ELECTION_Q ? "elect" : ""}" title="${qLabel(i)}${i === ELECTION_Q ? " · 총선" : ""}"></i>`).join("");
    const party = PARTIES.find((p) => p.id === G.party).name;
    const bg = BGS.find((b) => b.id === G.bg).name;
    const left = Math.max(0, TERM - G.q);
    return `<header class="top">
      <h1><small>제21대 대통령 · ${party} · ${bg} 출신</small>${esc(G.name)} 정부</h1>
      <div class="term">
        <div class="term-head"><b>${G.phase === "over" ? "임기 종료" : qLabel(G.q)}</b><span class="mono">${G.phase === "over" ? "" : `남은 임기 ${left}분기`}</span></div>
        <div class="segs" aria-label="임기 진행">${segs}</div>
      </div>
    </header>`;
  }

  function board() {
    const s = G.s;
    const row = (k) => { const v = s[k]; const lvl = k === "fat" ? "fat" : v < 30 ? "low" : v < 45 ? "mid" : ""; return `<div class="stat"><span class="nm">${NAMES[k]}</span><div class="bar ${lvl}"><span style="width:${v}%"></span></div><span class="v">${v}</span></div>`; };
    const warns = [];
    if (s.ap <= 25 && s.as <= 40) warns.push("탄핵 경고: 지지율·국회 협조 모두 위험 수준");
    if (s.tr < -20) warns.push("국가부도 경고: 국고 −60조에서 부도");
    if (s.se < 15) warns.push("안보 경고: 안보가 무너지기 직전");
    if (s.fat >= 70) warns.push("과로: 실언·건강 사건이 잦아집니다");
    return `<aside class="board" aria-label="국정 지표">
      <div class="poll">
        <span class="label">국정 수행 지지율</span>
        <div class="poll-num"><strong class="mono">${s.ap}</strong><span>%</span></div>
        ${spark(G.hist, 54, "spark", false)}
        <span class="src">한별리서치 · 전국 성인 1,002명 · 표본오차 ±3.1%p (95% 신뢰수준)</span>
      </div>
      ${["ec", "we", "se", "as", "fat"].map(row).join("")}
      <div class="treasury"><span class="nm" style="font-weight:600">국고</span><b class="${s.tr < 0 ? "neg" : ""}">${s.tr.toLocaleString("ko-KR")}조 원</b></div>
      ${warns.length ? `<div class="warns">${warns.map((w) => `<div class="warn">${w}</div>`).join("")}</div>` : ""}
    </aside>`;
  }

  function docCard() {
    const ev = EV[G.cur] || QUIET;
    const no = `대통-${2027 + Math.floor((G.q + 1) / 4)}-${String(G.q * 37 + 104).padStart(4, "0")}`;
    const r = G.result;
    let elect = "";
    if (G.electionNote && G.q === ELECTION_Q) elect = `<div class="result" style="margin-bottom:18px"><span class="label">총선 결과</span><p>제23대 총선에서 여당이 <b>${G.electionNote.verdict}</b>했습니다. 국회 협조 ${G.electionNote.before} → <b>${G.electionNote.seats}</b></p></div>`;
    return `<article class="doc" aria-live="polite">
      <div class="doc-meta"><span><span class="cls">대외비</span> · ${ev.dept} 보고</span><span class="mono">문서번호 ${no}</span></div>
      ${elect}
      <h2>${ev.title}</h2>
      <p>${ev.body}</p>
      ${r ? `<div class="result ${r.bad ? "bad" : ""}"><span class="label">결재 사항 · ${esc(ev.choices[r.pick].t)}</span><p>${esc(r.text)}</p><div class="deltas">${chips(r.d)}</div></div><div class="stamp">결재<br>${esc(G.name.slice(0, 3))}</div>`
        : `<div class="choices">${ev.choices.map((c, i) => `<button class="choice" data-choice="${i}"><span class="k">${"가나다"[i]}.</span><span class="t">${esc(c.t)}${c.s ? `<span class="s">${esc(c.s)}</span>` : ""}</span></button>`).join("")}</div>`}
    </article>`;
  }

  function agenda() {
    const on = G.phase === "action";
    const dots = [0, 1].map((i) => `<i class="${i < G.pc ? "on" : ""}"></i>`).join("");
    const done = G.acted.map((a) => `<div class="result ${a.bad ? "bad" : ""}"><span class="label">${a.name}</span><p>${esc(a.text)}</p><div class="deltas">${chips(a.d)}</div></div>`).join("");
    return `<section class="agenda" aria-label="이번 분기 일정">
      <div class="agenda-head"><h3>이번 분기 일정</h3><span class="pc">남은 일정 ${dots}</span></div>
      ${on ? "" : `<p class="hint">위 보고서를 먼저 결재하세요.</p>`}
      <div class="acts">${ACTIONS.map((a) => `<button class="act" data-act="${a.id}" ${!on || G.pc <= 0 ? "disabled" : ""}><b>${a.name}</b><span>${a.desc}</span></button>`).join("")}</div>
      ${done}
      ${on ? `<button class="next" data-next>${G.q === TERM - 1 ? "퇴임하기" : `${qLabel(G.q + 1)}로 →`}</button>` : ""}
    </section>`;
  }

  function logBox() {
    return `<section class="log" aria-label="국정 일지"><h3>국정 일지</h3><ol>${G.log.map((l) => `<li class="${l.kind}"><span class="when">${l.when}</span><span class="what">${esc(l.text)}</span></li>`).join("")}</ol></section>`;
  }

  function endingView() {
    const sc = score();
    const s = G.s;
    const kinds = { retire: ["퇴임", "5년의 임기를 마쳤습니다"], default: ["국가부도", "나라 곳간이 바닥났습니다"], war: ["안보 붕괴", "국가비상사태가 선포됐습니다"], impeach: ["탄핵", "국회가 탄핵소추안을 가결했습니다"] };
    const [k, h] = kinds[G.end];
    const served = Math.min(G.q, TERM);
    const story = G.end === "retire"
      ? `${esc(G.name)} 대통령은 ${served}분기 임기를 모두 채우고 관저를 떠났다. 퇴임 직전 지지율은 ${s.ap}%, 임기 평균은 ${sc.avgAp}%였다.`
      : `${esc(G.name)} 대통령은 취임 ${served}분기 만에 물러났다. 마지막 지지율은 ${s.ap}%였다.`;
    return `<section class="ending">
      <span class="kind">${k} · ${qLabel(Math.min(G.q, TERM - 1))}</span>
      <h2>${h}</h2>
      <div class="verdict"><div class="grade">${sc.grade}</div><div class="verdict-txt"><span class="label">역사의 평가</span><b>${sc.title}</b><span>별명: ${sc.nick} · 종합 ${sc.v}점</span></div></div>
      <p>${story}</p>
      ${spark(G.hist, 120, "bigspark", true)}
      <div class="finals">
        <div><span class="label">지지율</span><b>${s.ap}%</b></div>
        <div><span class="label">경제</span><b>${s.ec}</b></div>
        <div><span class="label">민생</span><b>${s.we}</b></div>
        <div><span class="label">안보</span><b>${s.se}</b></div>
        <div><span class="label">국회</span><b>${s.as}</b></div>
        <div><span class="label">국고</span><b>${s.tr}조</b></div>
      </div>
      <button class="oath" data-restart>다시 출마하기</button>
    </section>`;
  }

  function setupView() {
    const opt = (group, o) => `<label class="opt"><input type="radio" name="${group}" id="${group}-${o.id}" value="${o.id}" ${draft[group] === o.id ? "checked" : ""}><b>${o.name}</b><span>${o.desc}</span><em>${o.tag}</em></label>`;
    return `<header class="top"><h1><small>한별공화국 · 가상 국정 시뮬레이션</small>대통령 5년</h1></header>
    <section class="setup">
      <div class="setup-intro">
        <h2>당선을 축하드립니다.<br>내일 아침 취임 선서가 있습니다.</h2>
        <p>임기는 5년, 20분기입니다. 매 분기 보고서 한 건을 결재하고 일정 두 개를 고릅니다. 지지율과 국회 협조가 함께 바닥나면 탄핵, 국고가 −60조 원 아래로 떨어지면 국가부도입니다. 2028년 2분기에는 총선이 있습니다.</p>
      </div>
      <div class="field"><label class="label" for="pname">대통령 이름</label>
        <div class="namerow"><input id="pname" maxlength="10" value="${esc(draft.name)}" autocomplete="off"><button class="ghost" data-reroll type="button">다른 이름</button></div></div>
      <div class="field"><span class="label">소속 정당</span><div class="opts">${PARTIES.map((p) => opt("party", p)).join("")}</div></div>
      <div class="field"><span class="label">출신</span><div class="opts">${BGS.map((b) => opt("bg", b)).join("")}</div></div>
      <button class="oath" data-start>취임 선서</button>
    </section>`;
  }

  function render() {
    const app = $("#app");
    if (!G) { app.innerHTML = setupView(); return; }
    if (G.phase === "over") { app.innerHTML = header() + `<div class="grid">${board()}<div class="desk">${endingView()}${logBox()}</div></div>`; return; }
    app.innerHTML = header() + `<div class="grid">${board()}<div class="desk">${docCard()}${agenda()}${logBox()}</div></div>`;
  }

  document.addEventListener("click", (e) => {
    const t = e.target.closest("button");
    if (!t) return;
    if (t.dataset.choice !== undefined && G && G.phase === "event") choose(+t.dataset.choice);
    else if (t.dataset.act) act(t.dataset.act);
    else if (t.hasAttribute("data-next")) { nextQuarter(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    else if (t.hasAttribute("data-start")) { newGame(); }
    else if (t.hasAttribute("data-reroll")) { draft.name = randName(); const i = $("#pname"); if (i) i.value = draft.name; }
    else if (t.hasAttribute("data-restart")) { G = null; draft.name = randName(); render(); window.scrollTo({ top: 0 }); }
  });
  document.addEventListener("input", (e) => { if (e.target.id === "pname") draft.name = e.target.value; });
  document.addEventListener("change", (e) => { if (e.target.name === "party" || e.target.name === "bg") draft[e.target.name] = e.target.value; });

  function start(data) {
    if (data && data.G) { G = data.G; if (data.draft) Object.assign(draft, data.draft); }
    render();
  }
  window.claude?.hot?.snapshot?.(() => ({ G, draft }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
