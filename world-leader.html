<title>세계 지도자 5년</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IM+Fell+English:ital@0;1&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: 상황실 — 맨 위 정치 지도(빅토리아식 지도 모드), 아래 왼쪽 국정 지표판, 오른쪽 결재 보고서와 일정, 맨 아래 국정 일지. 좁은 화면은 한 줄로 쌓임. */
:root {
  --bg: #e9eef0;
  --sheet: #ffffff;
  --ink: #17212b;
  --muted: #586773;
  --line: #d0d8dd;
  --accent: #1d6a5b;
  --accent-soft: #dbeae5;
  --seal: #b3261e;
  --good: #23784a;
  --bad: #b3261e;
  --warn: #9a6300;
  --track: #e0e6e9;
  --sea: #b9cdd6;
  --land: #d9dcd6;
  --border: #ffffff;
  --me: #d29a18;
  --r-ally: #3f8f62;
  --r-friend: #9cc8a4;
  --r-neutral: #e3dfcf;
  --r-cool: #e7a98f;
  --r-hostile: #c4483a;
  --q1: #f1e9d2; --q2: #d8d29c; --q3: #a9bf78; --q4: #6e9e5a; --q5: #3d7449;
  --f-display: "Gowun Batang", "Nanum Myeongjo", "Noto Serif CJK KR", "Noto Serif JP", "Songti SC", Georgia, serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Hiragino Sans", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1418; --sheet: #172027; --ink: #e4e9ed; --muted: #92a0ab; --line: #29343d;
    --accent: #63b9a5; --accent-soft: #1c3430; --seal: #e3685e; --good: #5cc28a; --bad: #ec7a70; --warn: #e0a84a;
    --track: #232f38; --sea: #13242d; --land: #2a3238; --border: #0e1418; --me: #f0b83a;
    --r-ally: #3d8a5f; --r-friend: #4f6f57; --r-neutral: #4a4a40; --r-cool: #7a4c3f; --r-hostile: #a8392d;
    --q1: #3a3a2e; --q2: #4f5a35; --q3: #557a3e; --q4: #4f9157; --q5: #6cc07a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1418; --sheet: #172027; --ink: #e4e9ed; --muted: #92a0ab; --line: #29343d;
  --accent: #63b9a5; --accent-soft: #1c3430; --seal: #e3685e; --good: #5cc28a; --bad: #ec7a70; --warn: #e0a84a;
  --track: #232f38; --sea: #13242d; --land: #2a3238; --border: #0e1418; --me: #f0b83a;
  --r-ally: #3d8a5f; --r-friend: #4f6f57; --r-neutral: #4a4a40; --r-cool: #7a4c3f; --r-hostile: #a8392d;
  --q1: #3a3a2e; --q2: #4f5a35; --q3: #557a3e; --q4: #4f9157; --q5: #6cc07a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 48px;
}
.wrap { max-width: 1440px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; font-weight: 700; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 11.5px; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* 머리말 */
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 24px; padding-bottom: 12px; border-bottom: 2px solid var(--ink); }
.top h1 { font-size: clamp(22px, 3.6vw, 32px); line-height: 1.15; display: flex; align-items: center; gap: 10px; }
.top h1 .flag { line-height: 1; }
.cc { display: inline-block; font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: .04em; line-height: 1; padding: 3px 4px; border: 1px solid currentColor; border-radius: 3px; vertical-align: middle; opacity: .8; }
.top h1 .cc { font-size: 13px; padding: 4px 6px; }
.top h1 small { display: block; font-family: var(--f-body); font-size: 12.5px; font-weight: 500; color: var(--muted); letter-spacing: .04em; margin-bottom: 4px; }
.top-right { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 20px; min-width: 0; flex: 0 1 460px; justify-content: flex-end; }
.term { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 260px; }
.term-head { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.term-head b { font-family: var(--f-display); font-size: 18px; }
.segs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; }
.segs i { height: 8px; background: var(--track); border-radius: 1px; }
.segs i.done { background: var(--accent); }
.segs i.now { background: var(--seal); }
.segs i.elect { box-shadow: inset 0 -3px 0 var(--warn); }
.lang { display: flex; flex-direction: column; gap: 3px; }
.lang select { padding: 5px 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--sheet); font-size: 13px; }
.lang-note { font-size: 11.5px; color: var(--muted); max-width: 220px; line-height: 1.35; }

/* 지도 */
.mapwrap { position: relative; background: var(--sea); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.mapwrap canvas { display: block; width: 100%; height: clamp(320px, 40vw, 640px); max-height: 66vh; cursor: grab; touch-action: none; }
.mapwrap canvas:active { cursor: grabbing; }
.mapwrap canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.attrib { position: absolute; right: 10px; bottom: 6px; font-size: 10.5px; color: var(--muted); background: color-mix(in srgb, var(--sheet) 75%, transparent); padding: 1px 6px; border-radius: 3px; max-width: calc(100% - 20px); }
.inspector { bottom: 30px; }
.modes { position: absolute; left: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 4px; max-width: calc(100% - 90px); }
.modes button { padding: 4px 10px; border: 1px solid var(--line); border-radius: 99px; background: var(--sheet); font-size: 12.5px; font-weight: 600; opacity: .92; }
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); opacity: 1; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: var(--r); background: var(--sheet); font-weight: 700; }
.legend { position: absolute; left: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; background: color-mix(in srgb, var(--sheet) 88%, transparent); padding: 5px 10px; border-radius: var(--r); font-size: 11.5px; max-width: calc(100% - 20px); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { width: 12px; height: 10px; border-radius: 2px; display: inline-block; border: 1px solid var(--line); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--sheet); font-size: 12.5px; padding: 5px 9px; border-radius: 4px; white-space: nowrap; transform: translate(-50%, -130%); }
.inspector { position: absolute; right: 10px; bottom: 10px; width: min(300px, calc(100% - 20px)); background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 6px 24px rgb(0 0 0 / .18); }
.inspector h3 { font-size: 17px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.inspector h3 button { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 0 2px; }
.insp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 8px; font-size: 12px; }
.insp-grid b { display: block; font-family: var(--f-mono); font-size: 14px; }
.relbar { font-size: 12.5px; display: flex; justify-content: space-between; }
.dip { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.dip button { padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--r); background: transparent; font-size: 12.5px; font-weight: 600; text-align: left; }
.dip button:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.dip button:disabled { opacity: .4; cursor: not-allowed; }
.mapfail { padding: 40px 20px; text-align: center; color: var(--muted); }
@media (max-width: 640px) { .inspector { position: static; width: auto; margin: 8px; box-shadow: none; } .legend { position: static; margin: 0 8px 8px; } }

/* 본문 그리드 */
.grid { display: grid; grid-template-columns: 270px minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
@media (max-width: 1220px) { .grid { grid-template-columns: 270px minmax(0, 1fr); } .grid > .feed { grid-column: 2; } }
@media (max-width: 880px) { .grid { grid-template-columns: minmax(0, 1fr); } .grid > .feed { grid-column: auto; } }

/* 여론 피드 (가상 SNS) */
.feed { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.feed-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.feed-head h3 { font-size: 19px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.feed-head .tag { font-family: var(--f-body); font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; }
.feed-head p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.45; }
.compose { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.compose textarea { width: 100%; min-height: 64px; resize: vertical; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); font: inherit; font-size: 14px; color: var(--ink); }
.compose-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.compose button, .feed-more { padding: 6px 14px; border: 0; border-radius: 99px; background: var(--accent); color: var(--sheet); font-weight: 700; font-size: 13px; }
.compose button:disabled, .feed-more:disabled { opacity: .45; cursor: not-allowed; }
.posts { list-style: none; margin: 0; padding: 0; max-height: 760px; overflow-y: auto; }
.post { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.post.reply { padding-left: 40px; background: color-mix(in srgb, var(--bg) 55%, transparent); }
.av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 15px; color: #fff; }
.post.reply .av { width: 30px; height: 30px; font-size: 12px; }
.ph { display: flex; flex-wrap: wrap; gap: 0 6px; align-items: baseline; font-size: 13px; min-width: 0; }
.ph b { font-weight: 700; }
.ph .hd, .ph .tm { color: var(--muted); font-size: 12.5px; }
.ph .vf { color: var(--accent); font-size: 12px; }
.ph .fc { font-size: 11px; font-weight: 600; padding: 0 7px; border: 1px solid currentColor; border-radius: 99px; color: var(--muted); }
.ph .fc-pro { color: var(--good); }
.ph .fc-anti, .ph .fc-radical_left, .ph .fc-radical_right { color: var(--bad); }
.ph .fc-pessimistic { color: var(--warn); }
.pt { margin: 3px 0 6px; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
.pa { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--muted); font-family: var(--f-mono); align-items: center; }
.feed-foot { padding: 10px 16px 14px; display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.feed-empty { padding: 22px 16px; font-size: 13px; color: var(--muted); }
.dirty-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding-top: 6px; border-top: 1px dashed var(--line); }
.dirty-head .label { color: var(--bad); }
.acts.dirty .act { border-style: dashed; border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.acts.dirty .act:hover:not(:disabled) { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.choice.shady { border-style: dashed; border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.choice.shady .k { color: var(--bad); }
.doc.scandal { box-shadow: inset 0 4px 0 var(--bad); }
.opts.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 480px) { .opts.two { grid-template-columns: minmax(0, 1fr); } }
.opt.off { opacity: .5; cursor: not-allowed; }
.field-err { font-size: 12.5px; color: var(--bad); font-weight: 600; }
#pname[aria-invalid="true"] { border-color: var(--bad); }
.scorecard { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .scorecard { grid-template-columns: minmax(0, 1fr); } }
.sc-col { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.sc-col strong { font-size: 30px; line-height: 1.1; }
.sc-col.greed strong { color: var(--bad); }
.sc-col.total { background: var(--ink); color: var(--sheet); border-color: var(--ink); justify-content: center; }
.sc-col.total .label { color: inherit; opacity: .75; }
.sc-col.total strong { font-size: 40px; }
.sc-col ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--muted); }
.sc-col li { display: flex; justify-content: space-between; gap: 10px; }
.sc-col li b { color: var(--ink); font-weight: 600; white-space: nowrap; }
.lb { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 18px clamp(16px, 4vw, 26px); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.setup + .lb { margin-top: 18px; }
.lb-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.lb-head h3 { font-size: 21px; }
.lb-tabs { display: flex; gap: 4px; }
.lb-tabs button { padding: 4px 12px; border: 1px solid var(--line); border-radius: 99px; background: transparent; font-size: 13px; font-weight: 600; }
.lb-tabs button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.lb-status { margin: 0; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lb-status.ok { color: var(--good); }
.lb-status.warn { color: var(--warn); }
.lb-scroll { overflow-x: auto; }
.lb-table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.lb-table th { text-align: left; font-size: 11.5px; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.lb-table td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.lb-table .num { text-align: right; }
.lb-table td.num { font-size: 15px; font-weight: 600; }
.lb-table .rank { font-family: var(--f-display); font-weight: 700; color: var(--muted); width: 32px; }
.lb-table tr:nth-child(1) .rank { color: var(--me); font-size: 17px; }
.lb-table tr.me td { background: var(--accent-soft); }
.lb-table .sub { display: block; font-size: 11.5px; color: var(--muted); }
.busy-dot::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 6px; animation: pulse 1s infinite alternate; }
.board { display: flex; flex-direction: column; gap: 12px; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.poll { display: flex; flex-direction: column; gap: 4px; padding-bottom: 12px; border-bottom: 1px dashed var(--line); }
.poll-num { display: flex; align-items: baseline; gap: 8px; }
.poll-num strong { font-family: var(--f-display); font-size: 50px; line-height: 1; }
.poll-num span { font-size: 18px; color: var(--muted); }
.poll .src { font-size: 11px; color: var(--muted); line-height: 1.4; }
.spark { width: 100%; height: 50px; display: block; }
.stat { display: grid; grid-template-columns: 64px 1fr 34px; align-items: center; gap: 8px; font-size: 13px; }
.stat .nm { font-weight: 600; }
.bar { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .5s ease; }
.bar.low > span { background: var(--bad); }
.bar.mid > span { background: var(--warn); }
.bar.fat > span { background: var(--muted); }
.stat .v { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 13px; }
.facts { display: flex; flex-direction: column; gap: 4px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--muted); }
.facts b { color: var(--ink); font-weight: 600; }
.warns { display: flex; flex-direction: column; gap: 6px; }
.warn { font-size: 12.5px; padding: 6px 10px; border-radius: 4px; background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); font-weight: 600; }

.desk { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.doc { position: relative; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 24px clamp(18px, 4vw, 34px) 26px; overflow: hidden; }
.doc-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; font-size: 12px; color: var(--muted); padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
.doc-meta .cls { color: var(--seal); font-weight: 700; letter-spacing: .1em; }
.doc h2 { font-size: clamp(21px, 3vw, 27px); line-height: 1.3; margin-bottom: 10px; padding-right: 70px; }
.doc p { margin: 0 0 16px; max-width: 64ch; }
.tr-note { display: inline-block; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.tr-note.busy::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 6px; animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: .3; } to { opacity: 1; } }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice { text-align: left; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; padding: 13px 15px; background: transparent; border: 1px solid var(--line); border-radius: var(--r); transition: border-color .15s, background .15s; }
.choice:hover { border-color: var(--accent); background: var(--accent-soft); }
.choice .k { font-family: var(--f-display); font-weight: 700; font-size: 17px; color: var(--accent); line-height: 1.4; }
.choice .t { font-weight: 600; }
.choice .s { display: block; font-size: 13px; color: var(--muted); font-weight: 400; margin-top: 2px; }
.result { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; background: var(--bg); border-radius: var(--r); }
.result p { margin: 0; }
.result.bad { box-shadow: inset 3px 0 0 var(--bad); }
.deltas { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--f-mono); font-size: 12px; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; font-variant-numeric: tabular-nums; }
.chip.up { color: var(--good); }
.chip.down { color: var(--bad); }
.stamp { position: absolute; right: clamp(14px, 4vw, 30px); top: 58px; width: 80px; height: 80px; border: 3px solid var(--seal); border-radius: 50%; color: var(--seal); font-family: var(--f-display); font-weight: 700; display: grid; place-items: center; text-align: center; font-size: 14px; line-height: 1.15; transform: rotate(-14deg); opacity: .85; animation: stamp .35s cubic-bezier(.2,1.6,.4,1) both; pointer-events: none; }
.stamp::before { content: ""; position: absolute; inset: 5px; border: 1px solid var(--seal); border-radius: 50%; }
@keyframes stamp { from { transform: rotate(-14deg) scale(1.8); opacity: 0; } to { transform: rotate(-14deg) scale(1); opacity: .85; } }

.agenda { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 16px clamp(16px, 4vw, 22px); display: flex; flex-direction: column; gap: 12px; }
.agenda-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.agenda-head h3 { font-size: 19px; }

  // 글자를 곡선 경로를 따라 쓴다 (빅토리아식 국가명)
  function curvedText(text, pts, size, spacing, fill, halo) {
    const seg = [];
    let total = 0;
    for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(l); total += l; }
    if (pts[0][0] > pts[pts.length - 1][0]) { pts = pts.slice().reverse(); seg.reverse(); }
    const chars = [...text];
    const widths = chars.map((ch) => ctx.measureText(ch).width + spacing);
    const tw = widths.reduce((a, b) => a + b, 0) - spacing;
    if (tw > total * 1.25 || total < 2) return false;
    let d = (total - tw) / 2;
    const at = (dist) => {
      let acc = 0;
      for (let i = 0; i < seg.length; i++) {
        if (acc + seg[i] >= dist || i === seg.length - 1) {
          const f = seg[i] ? clamp((dist - acc) / seg[i], 0, 1) : 0;
          const a = pts[i], b = pts[i + 1];
          return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, Math.atan2(b[1] - a[1], b[0] - a[0])];

      }
      return [pts[0][0], pts[0][1], 0];
    };
    const place = chars.map((ch, i) => { const mid = d + (widths[i] - spacing) / 2; d += widths[i]; return [ch, at(mid)]; });
    for (const pass of [0, 1]) {
      for (const [ch, [x, y, ang]] of place) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(clamp(ang, -1.1, 1.1));
        if (pass === 0) { ctx.strokeStyle = halo; ctx.lineWidth = Math.max(2, size * 0.16); ctx.strokeText(ch, 0, 0); }
        else { ctx.fillStyle = fill; ctx.fillText(ch, 0, 0); }
        ctx.restore();
      }
    }
    return true;
  }

  function drawMap() {

      ctx.textAlign = "center"; ctx.textBaseline = "middle";

        const p = AT.prov[id];

        const [x, y] = toScreen(p.lon, p.lat);
        if (x < -40 || y < -20 || x > MW + 40 || y > MH + 20) continue;

      for (const [lon, lat, tier, cap, name, cid] of AT.cities) {
        if (!(cap || (tier === 1 && z >= 5) || (tier === 2 && z >= 8))) continue;
        const [x, y] = toScreen(lon, lat);

  // 조작

  function spark(vals, h, cls, total, showAxis) {

      <div class="setup-form">
        <div class="field"><label class="label" for="csel">${t("country")}</label>
          <div class="row"><select id="csel">${sorted.map((i) => `<option value="${i}" ${i === draft.iso ? "selected" : ""}>${esc(cname(i))}</option>`).join("")}</select><button class="ghost" data-random type="button">${t("random")}</button></div></div>
        <div class="preview">
          <h3>${flag(c.iso2)} ${esc(cname(c.iso))}</h3>
          <span class="sys">${title(c)} · ${t("sys_" + c.gov)} · ${t("reg_" + reg)} · ${reg === "aut" ? t("yrs", { n: 5 }) : t("yrs", { n: c.term })} · ${t("bloc_" + c.bloc)}</span>
          <div class="mini">${["ec", "we", "se", "as", "env", "fr"].map((k) => `<div>${k === "as" && reg === "aut" ? t("as_aut") : t(k)}<b>${c[k]}</b></div>`).join("")}</div>
        </div>
        <div class="field"><span class="label">${t("mode")}</span><div class="opts two">
          <label class="opt"><input type="radio" name="mode" id="mode-gov" value="gov" ${draft.mode === "gov" ? "checked" : ""}><b>${t("mode_gov")}</b><span>${t("mode_gov_d")}</span></label>
          <label class="opt${mon ? " off" : ""}"><input type="radio" name="mode" id="mode-camp" value="camp" ${draft.mode === "camp" ? "checked" : ""} ${mon ? "disabled" : ""}><b>${campLbl}</b><span>${mon ? t("mode_mon") : campDesc}</span></label>
        </div></div>
        <div class="field"><label class="label" for="pname">${t("leader")}</label>
          <div class="row"><input id="pname" maxlength="24" value="${esc(draft.name)}" autocomplete="off" aria-invalid="${draft.err ? "true" : "false"}"><button class="ghost" data-reroll type="button">${t("reroll")}</button></div>
          ${draft.err ? `<span class="field-err" role="alert">${esc(draft.err)}</span>` : ""}</div>
        <div class="field"><label class="label" for="osel">${t("origin")}</label>
          <div class="row"><select id="osel">${[`<option value="${draft.iso}" ${draft.origin === draft.iso ? "selected" : ""}>${t("origin_same")} (${esc(cname(draft.iso))})</option>`].concat(sorted.filter((i) => i !== draft.iso).map((i) => `<option value="${i}" ${i === draft.origin ? "selected" : ""}>${esc(cname(i))}</option>`)).join("")}</select></div></div>
        <div class="field"><span class="label">${t("ideo")}</span><div class="opts">${["l", "c", "r"].map(opt).join("")}</div></div>
        <button class="oath" data-start>${t("start")}</button>
      </div>
      <p class="src-note">${t("srcNote")}</p>
    </section>`;
  }
  function render() {
    $("#top").innerHTML = topView();
    const app = $("#app");
    if (!G) { app.innerHTML = setupView() + lbView(); return; }
    if (G.phase === "over") { app.innerHTML = `<div class="grid">${board()}<div class="desk">${endingView()}${lbView()}${logBox()}</div>${feedView()}</div>`; return; }
    const cmp = $("#cmp"), draftTxt = cmp ? cmp.value : "", hadFocus = cmp && document.activeElement === cmp;
    app.innerHTML = `<div class="grid">${board()}<div class="desk">${docCard()}${agenda()}${logBox()}</div>${feedView()}</div>`;
    const cmp2 = $("#cmp"); if (cmp2 && draftTxt) { cmp2.value = draftTxt; if (hadFocus) cmp2.focus(); }
  }
  function renderAll() { render(); updateMap(); }
  let toastTimer;
  function toast(msg) { const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2600); }

  // ───────── 입력 ─────────
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.choice !== undefined && G && G.phase === "event") choose(+b.dataset.choice);
    else if (b.dataset.act) act(b.dataset.act);
    else if (b.dataset.dirty) dirty(b.dataset.dirty);
    else if (b.dataset.dip) dip(b.dataset.dip);
    else if (b.dataset.mode) { mapMode = b.dataset.mode; updateMap(); }
    else if (b.dataset.zoom) zoomBy(+b.dataset.zoom);
    else if (b.hasAttribute("data-close")) { selIso = null; updateMap(); }
    else if (b.hasAttribute("data-next")) { nextTurn(); updateMap(); }
    else if (b.hasAttribute("data-start")) newGame();
    else if (b.hasAttribute("data-random")) { draft.iso = pick(ISOS); draft.origin = draft.iso; draft.name = randName(draft.iso); draft.err = ""; renderAll(); focusIso(draft.iso); }
    else if (b.hasAttribute("data-reroll")) { draft.name = randName(draft.iso); draft.err = ""; render(); }
    else if (b.hasAttribute("data-feedmore")) genFeed("more", {});
    else if (b.hasAttribute("data-flfeed") && G && selIso) { const f = flOf(selIso); genFeed("foreign", { iso: selIso, leader: flName(f), policy: f.policy }); }
    else if (b.hasAttribute("data-post")) {
      const el = $("#cmp"); const txt = el ? el.value.trim() : "";
      const curTurn = isCamp() ? "c" + G.cq : G.q;
      if (!txt || !G || G.postedQ === curTurn) return;
      G.postedQ = curTurn; el.value = "";
      genFeed("leader", { text: txt.slice(0, 200) });
    }
    else if (b.dataset.lbtab) { LB.tab = b.dataset.lbtab; renderLB(); }
    else if (b.hasAttribute("data-lbretry")) { if (G) { G.submitted = false; submitRun(); } }
    else if (b.hasAttribute("data-restart")) { LB.status = ""; G = null; draft.name = randName(draft.iso); renderAll(); window.scrollTo({ top: 0 }); }
  });
  document.addEventListener("input", (e) => { if (e.target.id === "pname") { draft.name = e.target.value; if (draft.err) { draft.err = ""; const er = document.querySelector(".field-err"); if (er) er.remove(); } } });
  document.addEventListener("change", (e) => {
    if (e.target.name === "ideo") draft.ideo = e.target.value;
    if (e.target.name === "mode") draft.mode = e.target.value;
    if (e.target.id === "osel") draft.origin = e.target.value;
    if (e.target.id === "csel") { draft.iso = e.target.value; draft.origin = draft.iso; draft.name = randName(draft.iso); draft.err = ""; renderAll(); focusIso(draft.iso); }
    if (e.target.id === "langsel") {
      LANG = e.target.value; store.set("lang", LANG); document.documentElement.lang = LANG;
      renderAll(); ensureUiTr(); if (G && G.phase !== "over") ensureEventTr(EV[G.cur]);
    }
  });

  // ───────── 시작 ─────────
  function boot(data) {
    if (data && data.G) { G = data.G; if (data.draft) Object.assign(draft, data.draft); }
    document.documentElement.lang = LANG;
    initMap();
    renderAll();
    if (!G) focusIso(draft.iso);
    if (DEMO && !G) runDemo();
  }
  function runDemo() {
    const mode = location.hash === "#democamp" ? "camp" : "gov";
    draft.iso = "KOR"; draft.origin = "KOR"; draft.name = "한가람"; draft.ideo = "c"; draft.mode = mode;
    newGame();
    if (location.hash === "#demoend" || location.hash === "#demoterm") {
      const stop = () => G.phase === "over" || (location.hash === "#demoterm" && G.phase === "event" && EV[G.cur].term);
      let guard = 0;
      while (!stop() && guard++ < 120) {
        if (G.phase === "event") choose(EV[G.cur].term ? EV[G.cur].choices.length - 1 : 0);
        if (G.phase === "over") break;
        if (location.hash === "#demoend") { dirty(guard % 3 ? "slush" : "cover"); if (G.phase === "over") break; }
        act("speech"); if (G.phase === "over") break;
        nextTurn();
      }
      renderAll(); return;
    }
    if (mode === "camp") {
      choose(0); act("rally"); dirty("slush");
      campNext();
      G.c.party = 75;
      choose(Math.min(1, EV[G.cur].choices.length - 1)); act("partymeet"); dirty("rig");
      G.x.sus = 70; G.pendingScandal = "illegalFunds"; G.x.crimes[0].exposed = true; G.x.exposed = 1; G.x.scandals.push("illegalFunds");
      campNext();
      choose(0);
    } else {
      choose(0); act("speech"); selIso = "JPN"; dip("summit");
      nextQuarter();
      choose(Math.min(1, EV[G.cur].choices.length - 1)); dirty("slush"); dirty("crony");
      G.pendingScandal = "fl:slush"; G.x.crimes[0].exposed = true; G.x.exposed = 1; G.x.scandals.push("fl:slush"); G.x.sus = 55;
      nextQuarter();
      choose(1);
      G.postedQ = G.q; genFeed("leader", { text: "국민 여러분, 보도된 내용은 사실이 아닙니다. 끝까지 진실을 밝히겠습니다." });
      selIso = "JPN";
    }
    renderAll();
  }
  (async () => {
    try {
      if (window.claude && window.claude.use) {
        const s = await window.claude.use("sample");
        if (s) { SAMPLE = s; sampleState = "ready"; } else sampleState = "off";
      } else sampleState = "off";
    } catch { sampleState = "off"; }
    if (LANG !== "ko") { ensureUiTr(); if (G && G.phase !== "over") ensureEventTr(EV[G.cur]); }
    renderAll();
  })();
  initLeaderboard();
  window.claude?.hot?.snapshot?.(() => ({ G, draft }));
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
